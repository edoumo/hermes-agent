name: api-server-durable-workers
label: API Server Durable Workers
kind: platform
version: 0.3.2
description: >
  Experimental H4 extension for the built-in Hermes API server. The platform
  factory preserves the stock APIServerAdapter unless
  platforms.api_server.extra.durable_workers_api is explicitly enabled.
  When enabled, the qualified H2.1 session-scoped Durable Worker reads,
  writes, activation dispatch and authenticated SSE invalidation feed remain
  available, with H4 operator controls for session-scoped operational counts,
  retry of terminal failed workers and cancellation of locally supervised
  activations. Cancellation remains fail-closed: durable intent is persisted
  before lifecycle interruption, and a worker is released only after terminal
  CANCELLED is observed. H4 control routes use exact path/body contracts,
  reject query parameters, and preserve fail-closed object ownership 404s
  before reporting request-contract errors. The extension reuses the existing
  Hermes listener, bearer authentication, CORS and profile scope.
author: MITC
