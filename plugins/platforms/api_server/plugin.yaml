name: api-server-durable-workers
label: API Server Durable Workers
kind: platform
version: 0.4.0
description: >
  Experimental H5 extension for the built-in Hermes API server. The platform
  factory preserves the stock APIServerAdapter unless
  platforms.api_server.extra.durable_workers_api is explicitly enabled.
  When enabled, the qualified H2.1/H4 Durable Worker read, write, activation,
  SSE and operational recovery surfaces remain available. H5 adds a bounded
  task-DAG orchestration layer: pending task editing and reassignment, CAS-safe
  dependency add/remove, read-only graph projection, atomic dispatch of a READY
  task into the existing Durable Worker lifecycle, and task-aware recovery that
  reuses the same durable task message after operator cancellation or failure
  while creating a fresh activation. Task results reconcile automatically to
  completed/failed/pending and live lifecycle handles remain transient. The
  extension reuses the existing Hermes listener, bearer authentication, CORS
  and profile scope.
author: MITC
