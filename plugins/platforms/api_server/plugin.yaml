name: api-server-durable-workers
label: API Server Durable Workers
kind: platform
version: 0.1.0
description: >
  Experimental H2 extension for the built-in Hermes API server. The platform
  factory preserves the stock APIServerAdapter unless
  platforms.api_server.extra.durable_workers_api is explicitly enabled.
  When enabled, session-scoped read-only Durable Worker routes are added for
  Hermes Harness UI qualification.
author: MITC
