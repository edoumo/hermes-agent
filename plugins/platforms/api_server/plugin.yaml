name: api-server-durable-workers
label: API Server Durable Workers
kind: platform
version: 0.2.1
description: >
  Experimental H2.1 extension for the built-in Hermes API server. The platform
  factory preserves the stock APIServerAdapter unless
  platforms.api_server.extra.durable_workers_api is explicitly enabled.
  When enabled, session-scoped Durable Worker reads, bounded write/control
  operations, activation dispatch and an authenticated SSE invalidation feed
  are added for Hermes Harness UI qualification. The extension reuses the
  existing Hermes listener, bearer authentication, CORS and profile scope.
  Version 0.2.1 aligns activation dispatch with the native _create_agent
  keyword contract and restores pre-launch reservations immediately on parent
  construction failure.
author: MITC
